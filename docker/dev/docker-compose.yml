version: '3.8'
#Not working on previous version, will use directory name instead
#name: opentera-dev
services:
  db:
    image: postgres:18.7-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5433:5432'
    volumes:
      # PostgreSQL 18+ stores data in a version-specific subdirectory (/var/lib/postgresql/18/docker)
      - db-pg18:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/create_tables.sql
    networks:
      - app-network

  cache:
    image: redis:8.10-alpine
    restart: always
    ports:
      - '6380:6379'
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - cache:/data
    networks:
      - app-network

  cert-generator:
    build:
      context: ../../
      dockerfile: ./docker/dev/certificates/Dockerfile
    image: opentera-cert-generator
    volumes:
      - certificates:/teraserver/python/config/certificates
    healthcheck:
      # Healthy once the certificates have been generated in the certificates volume.
      test: ["CMD", "test", "-f", "/teraserver/python/config/certificates/site_cert.pem"]
      interval: 2s
      timeout: 2s
      retries: 30

  proxy:
    image: nginx:1.30-alpine
    restart: always
    volumes:
      - ./nginx/opentera.conf:/etc/nginx/opentera.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - certificates:/etc/certificates
      - nginx-logs:/etc/nginx/logs
    depends_on:
      cert-generator:
        condition: service_healthy
    ports:
      - '40075:40075'
    networks:
      - app-network

  opentera-server:
    build:
      context: ../../
      dockerfile: ./docker/dev/teraserver/Dockerfile
    image: opentera-server
    restart: always
    volumes:
      - ./teraserver/TeraServerConfig.ini:/teraserver/python/config/TeraServerConfig.ini
      - ./teraserver/FileTransferService.json:/teraserver/python/services/FileTransferService/FileTransferService.json
      - ./teraserver/LoggingService.json:/teraserver/python/services/LoggingService/LoggingService.json
      - ./teraserver/VideoRehabService.json:/teraserver/python/services/VideoRehabService/VideoRehabService.json
      - ./teraserver/EmailService.json:/teraserver/python/services/EmailService/EmailService.json
      - files:/teraserver/python/services/FileTransferService/files
    networks:
      - app-network
    # Debug port
    ports:
      - '5678:5678'
    depends_on:
      - cert-generator
      - proxy
      - cache
      - db

volumes:
  db-pg18:
    driver: local

  cache:
    driver: local

  certificates:
    driver: local

  nginx-logs:
    driver: local

  opentera-config:
    driver: local

  files:
    driver: local

networks:
  app-network:
